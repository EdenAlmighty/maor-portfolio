name: Set up
description: Node and cached node_modules (npm ci runs only when the lockfile changed).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
    - id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
